<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Infrastructure - Monitor de Servidores</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .status-online {
            background: #10b981;
            color: white;
        }
        
        .status-offline {
            background: #ef4444;
            color: white;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #4a5568;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #edf2f7;
        }
        
        .metric:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: #718096;
            font-weight: 500;
        }
        
        .metric-value {
            color: #2d3748;
            font-weight: bold;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .chart-container {
            position: relative;
            height: 200px;
            margin: 20px 0;
        }
        
        .process-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .process-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #edf2f7;
        }
        
        .process-item:hover {
            background: #f7fafc;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        .refresh-btn:hover {
            background: #5a67d8;
        }
        
        .error {
            color: #e53e3e;
            background: #fff5f5;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #feb2b2;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 MC Infrastructure - Monitor de Servidores</h1>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span class="status-badge status-online" id="apiStatus">API Online</span>
                    <span id="lastUpdate" style="margin-left: 20px; color: #718096;"></span>
                </div>
                <button class="refresh-btn" onclick="refreshAll()">🔄 Actualizar</button>
            </div>
        </div>
        
        <div id="errorContainer" class="error" style="display: none;"></div>
        
        <div class="grid">
            <!-- Sistema -->
            <div class="card">
                <h2>💻 Información del Sistema</h2>
                <div id="systemInfo">Cargando...</div>
            </div>
            
            <!-- CPU -->
            <div class="card">
                <h2>⚡ CPU</h2>
                <div id="cpuInfo">Cargando...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cpuProgress" style="width: 0%">0%</div>
                </div>
                <div class="chart-container">
                    <canvas id="cpuChart"></canvas>
                </div>
            </div>
            
            <!-- Memoria -->
            <div class="card">
                <h2>🧠 Memoria</h2>
                <div id="memoryInfo">Cargando...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="memoryProgress" style="width: 0%">0%</div>
                </div>
                <div class="chart-container">
                    <canvas id="memoryChart"></canvas>
                </div>
            </div>
            
            <!-- Disco -->
            <div class="card">
                <h2>💾 Disco</h2>
                <div id="diskInfo">Cargando...</div>
            </div>
            
            <!-- Red -->
            <div class="card">
                <h2>🌐 Red</h2>
                <div id="networkInfo">Cargando...</div>
            </div>
            
            <!-- Procesos -->
            <div class="card">
                <h2>📊 Top Procesos</h2>
                <div class="process-list" id="processInfo">Cargando...</div>
            </div>

            <!-- Historial -->
            <div class="card">
                <h2>🕒 Historial CPU y Memoria</h2>
                <div class="chart-container">
                    <canvas id="historyChart"></canvas>
                </div>
                <div id="historySummary" style="font-size: 14px; color: #4a5568;">Cargando...</div>
            </div>
        </div>
    </div>
    
    <script>
        let cpuChart, memoryChart, historyChart;
        
        // Inicializar gráficos
        function initCharts() {
            const ctx1 = document.getElementById('cpuChart').getContext('2d');
            cpuChart = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: ['Usado', 'Libre'],
                    datasets: [{
                        data: [0, 100],
                        backgroundColor: ['#667eea', '#e2e8f0']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
            
            const ctx2 = document.getElementById('memoryChart').getContext('2d');
            memoryChart = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['Usado', 'Disponible'],
                    datasets: [{
                        data: [0, 100],
                        backgroundColor: ['#764ba2', '#e2e8f0']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });

            const ctx3 = document.getElementById('historyChart').getContext('2d');
            historyChart = new Chart(ctx3, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'CPU %',
                            data: [],
                            borderColor: '#2563eb',
                            backgroundColor: 'rgba(37, 99, 235, 0.2)',
                            tension: 0.35,
                            fill: false,
                        },
                        {
                            label: 'Memoria %',
                            data: [],
                            borderColor: '#7c3aed',
                            backgroundColor: 'rgba(124, 58, 237, 0.2)',
                            tension: 0.35,
                            fill: false,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });
        }
        
        // Actualizar todos los datos
        async function refreshAll() {
            showError(null);
            await Promise.all([
                fetchSystemInfo(),
                fetchCPUInfo(),
                fetchMemoryInfo(),
                fetchDiskInfo(),
                fetchNetworkInfo(),
                fetchProcessInfo(),
                fetchHistoryInfo()
            ]);
            document.getElementById('lastUpdate').textContent = 
                'Última actualización: ' + new Date().toLocaleTimeString();
        }
        
        async function fetchData(endpoint) {
            try {
                const response = await fetch(endpoint);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                showError(`Error al conectar con la API: ${error.message}`);
                throw error;
            }
        }
        
        function showError(message) {
            const container = document.getElementById('errorContainer');
            if (message) {
                container.style.display = 'block';
                container.textContent = message;
                document.getElementById('apiStatus').className = 'status-badge status-offline';
                document.getElementById('apiStatus').textContent = 'API Offline';
            } else {
                container.style.display = 'none';
                document.getElementById('apiStatus').className = 'status-badge status-online';
                document.getElementById('apiStatus').textContent = 'API Online';
            }
        }
        
        async function fetchSystemInfo() {
            try {
                const data = await fetchData('/api/proxy/system');
                document.getElementById('systemInfo').innerHTML = `
                    <div class="metric">
                        <span class="metric-label">Hostname:</span>
                        <span class="metric-value">${data.hostname || 'N/A'}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Sistema:</span>
                        <span class="metric-value">${data.platform || 'N/A'}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Arquitectura:</span>
                        <span class="metric-value">${data.architecture || 'N/A'}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Procesador:</span>
                        <span class="metric-value">${data.processor || 'N/A'}</span>
                    </div>
                `;
            } catch (e) {
                document.getElementById('systemInfo').innerHTML = '<span class="error">Error al cargar</span>';
            }
        }
        
        async function fetchCPUInfo() {
            try {
                const data = await fetchData('/api/proxy/cpu');
                const usage = data.cpu_usage_percent || 0;
                document.getElementById('cpuProgress').style.width = usage + '%';
                document.getElementById('cpuProgress').textContent = usage.toFixed(1) + '%';
                
                document.getElementById('cpuInfo').innerHTML = `
                    <div class="metric">
                        <span class="metric-label">Núcleos Físicos:</span>
                        <span class="metric-value">${data.cpu_count_physical || 'N/A'}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Núcleos Lógicos:</span>
                        <span class="metric-value">${data.cpu_count_logical || 'N/A'}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Frecuencia:</span>
                        <span class="metric-value">${data.cpu_frequency_current ? data.cpu_frequency_current.toFixed(0) + ' MHz' : 'N/A'}</span>
                    </div>
                `;
                
                cpuChart.data.datasets[0].data = [usage, 100 - usage];
                cpuChart.update();
            } catch (e) {
                document.getElementById('cpuInfo').innerHTML = '<span class="error">Error al cargar</span>';
            }
        }
        
        async function fetchMemoryInfo() {
            try {
                const data = await fetchData('/api/proxy/memory');
                document.getElementById('memoryProgress').style.width = data.memory_percent + '%';
                document.getElementById('memoryProgress').textContent = data.memory_percent + '%';
                
                document.getElementById('memoryInfo').innerHTML = `
                    <div class="metric">
                        <span class="metric-label">Total:</span>
                        <span class="metric-value">${data.memory_total_gb || 0} GB</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Usado:</span>
                        <span class="metric-value">${data.memory_used_gb || 0} GB</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Disponible:</span>
                        <span class="metric-value">${data.memory_available_gb || 0} GB</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Swap:</span>
                        <span class="metric-value">${data.swap_percent || 0}%</span>
                    </div>
                `;
                
                memoryChart.data.datasets[0].data = [data.memory_percent || 0, 100 - (data.memory_percent || 0)];
                memoryChart.update();
            } catch (e) {
                document.getElementById('memoryInfo').innerHTML = '<span class="error">Error al cargar</span>';
            }
        }
        
        async function fetchDiskInfo() {
            try {
                const data = await fetchData('/api/proxy/disk');
                let html = '';
                if (data.partitions) {
                    data.partitions.forEach(part => {
                        html += `
                            <div style="margin-bottom: 15px; padding: 10px; background: #f7fafc; border-radius: 5px;">
                                <strong>${part.mountpoint}</strong> (${part.device})
                                <div class="progress-bar" style="margin-top: 10px;">
                                    <div class="progress-fill" style="width: ${part.percent}%">${part.percent}%</div>
                                </div>
                                <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px;">
                                    <span>Usado: ${part.used_gb} GB</span>
                                    <span>Total: ${part.total_gb} GB</span>
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('diskInfo').innerHTML = html || 'Sin información de discos';
            } catch (e) {
                document.getElementById('diskInfo').innerHTML = '<span class="error">Error al cargar</span>';
            }
        }
        
        async function fetchNetworkInfo() {
            try {
                const data = await fetchData('/api/proxy/network');
                document.getElementById('networkInfo').innerHTML = `
                    <div class="metric">
                        <span class="metric-label">Datos Enviados:</span>
                        <span class="metric-value">${data.bytes_sent_gb || 0} GB</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Datos Recibidos:</span>
                        <span class="metric-value">${data.bytes_received_gb || 0} GB</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Paquetes Enviados:</span>
                        <span class="metric-value">${data.packets_sent || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Paquetes Recibidos:</span>
                        <span class="metric-value">${data.packets_received || 0}</span>
                    </div>
                `;
            } catch (e) {
                document.getElementById('networkInfo').innerHTML = '<span class="error">Error al cargar</span>';
            }
        }
        
        async function fetchProcessInfo() {
            try {
                const data = await fetchData('/api/proxy/processes?limit=10');
                let html = '';
                if (data.top_processes) {
                    data.top_processes.forEach(proc => {
                        html += `
                            <div class="process-item">
                                <span>${proc.name || 'Unknown'} (PID: ${proc.pid})</span>
                                <span style="color: #667eea; font-weight: bold;">CPU: ${proc.cpu_percent?.toFixed(1) || 0}%</span>
                            </div>
                        `;
                    });
                }
                document.getElementById('processInfo').innerHTML = html || 'Sin información de procesos';
            } catch (e) {
                document.getElementById('processInfo').innerHTML = '<span class="error">Error al cargar</span>';
            }
        }

        async function fetchHistoryInfo() {
            try {
                const data = await fetchData('/api/proxy/history?limit=20');
                const items = data.items || [];
                const labels = items.map(item => {
                    const date = new Date(item.timestamp);
                    return date.toLocaleTimeString();
                });
                const cpuValues = items.map(item => item.cpu_usage_percent || 0);
                const memoryValues = items.map(item => item.memory_percent || 0);

                historyChart.data.labels = labels;
                historyChart.data.datasets[0].data = cpuValues;
                historyChart.data.datasets[1].data = memoryValues;
                historyChart.update();

                if (items.length > 0) {
                    const avgCpu = cpuValues.reduce((a, b) => a + b, 0) / cpuValues.length;
                    const avgMemory = memoryValues.reduce((a, b) => a + b, 0) / memoryValues.length;
                    const last = items[items.length - 1];
                    document.getElementById('historySummary').innerHTML =
                        `Registros: ${items.length} | Ultimo host: ${last.hostname || 'N/A'} | Promedio CPU: ${avgCpu.toFixed(1)}% | Promedio Memoria: ${avgMemory.toFixed(1)}%`;
                } else {
                    document.getElementById('historySummary').textContent = 'Sin datos historicos disponibles.';
                }
            } catch (e) {
                document.getElementById('historySummary').innerHTML = '<span class="error">Error al cargar historial</span>';
            }
        }
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            refreshAll();
            // Actualizar cada 30 segundos
            setInterval(refreshAll, 30000);
        });
    </script>
</body>
</html>
