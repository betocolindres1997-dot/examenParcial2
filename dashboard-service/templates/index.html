<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Infrastructure - Monitor de Servidores</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #05080d;
            --bg-accent: #0c1422;
            --surface: #111827;
            --surface-soft: #1f2937;
            --border: #374151;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --blue-dark: #1e3a8a;
            --blue-mid: #2563eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            background: radial-gradient(circle at 15% 20%, #111827 0%, var(--bg-main) 50%),
                        linear-gradient(145deg, #030712 0%, var(--bg-accent) 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(145deg, #111827 0%, #0b1220 100%);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }
        
        .header h1 {
            color: #dbeafe;
            margin-bottom: 10px;
        }

        #lastUpdate {
            color: var(--text-muted);
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .status-online {
            background: #10b981;
            color: white;
        }
        
        .status-offline {
            background: #ef4444;
            color: white;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: linear-gradient(160deg, #111827 0%, #0f172a 100%);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
        }
        
        .card h2 {
            color: #bfdbfe;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #1f2937;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #273142;
        }
        
        .metric:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .metric-value {
            color: var(--text-main);
            font-weight: bold;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #1f2937;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid #374151;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue-dark) 0%, var(--blue-mid) 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .chart-container {
            position: relative;
            height: 200px;
            margin: 20px 0;
        }
        
        .process-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .process-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #273142;
        }
        
        .process-item:hover {
            background: #1f2937;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        .refresh-btn:hover {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
        }
        
        .error {
            color: #fecaca;
            background: #2a0d12;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #7f1d1d;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 MC Infrastructure - Monitor de Servidores</h1>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span class="status-badge status-online" id="apiStatus">API Online</span>
                    <span id="lastUpdate" style="margin-left: 20px;"></span>
                </div>
                <button class="refresh-btn" onclick="refreshAll()">🔄 Actualizar</button>
            </div>
        </div>
        
        <div id="errorContainer" class="error" style="display: none;"></div>
        
        <div class="grid">
            <!-- Sistema -->
            <div class="card">
                <h2>💻 Información del Sistema</h2>
                <div id="systemInfo">Cargando...</div>
            </div>
            
            <!-- CPU -->
            <div class="card">
                <h2>⚡ CPU</h2>
                <div id="cpuInfo">Cargando...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cpuProgress" style="width: 0%">0%</div>
                </div>
                <div class="chart-container">
                    <canvas id="cpuChart"></canvas>
                </div>
            </div>
            
            <!-- Memoria -->
            <div class="card">
                <h2>🧠 Memoria</h2>
                <div id="memoryInfo">Cargando...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="memoryProgress" style="width: 0%">0%</div>
                </div>
                <div class="chart-container">
                    <canvas id="memoryChart"></canvas>
                </div>
            </div>
            
            <!-- Disco -->
            <div class="card">
                <h2>💾 Disco</h2>
                <div id="diskInfo">Cargando...</div>
            </div>
            
            <!-- Red -->
            <div class="card">
                <h2>🌐 Red</h2>
                <div id="networkInfo">Cargando...</div>
            </div>
            
            <!-- Procesos -->
            <div class="card">
                <h2>📊 Top Procesos</h2>
                <div class="process-list" id="processInfo">Cargando...</div>
            </div>

            <!-- Historial -->
            <div class="card">
                <h2>🕒 Historial CPU y Memoria</h2>
                <div class="chart-container">
                    <canvas id="historyChart"></canvas>
                </div>
                <div id="historySummary" style="font-size: 14px; color: #9ca3af;">Cargando...</div>
            </div>
        </div>
    </div>
    
    <script>
        let cpuChart, memoryChart, historyChart;

        function initCharts() {
            const ctx1 = document.getElementById('cpuChart').getContext('2d');
            cpuChart = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: ['Usado', 'Libre'],
                    datasets: [{ data: [0, 100], backgroundColor: ['#1d4ed8', '#374151'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctx2 = document.getElementById('memoryChart').getContext('2d');
            memoryChart = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['Usado', 'Disponible'],
                    datasets: [{ data: [0, 100], backgroundColor: ['#1e3a8a', '#374151'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctx3 = document.getElementById('historyChart').getContext('2d');
            historyChart = new Chart(ctx3, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'CPU %',
                            data: [],
                            borderColor: '#60a5fa',
                            backgroundColor: 'rgba(96, 165, 250, 0.15)',
                            fill: false,
                            tension: 0.35
                        },
                        {
                            label: 'Memoria %',
                            data: [],
                            borderColor: '#1e3a8a',
                            backgroundColor: 'rgba(30, 58, 138, 0.2)',
                            fill: false,
                            tension: 0.35
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    }
                }
            });
        }

        async function fetchData(endpoint) {
            const response = await fetch(endpoint);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return await response.json();
        }

        function showError(message) {
            const container = document.getElementById('errorContainer');
            const badge = document.getElementById('apiStatus');

            if (message) {
                container.style.display = 'block';
                container.textContent = message;
                badge.className = 'status-badge status-offline';
                badge.textContent = 'API Offline';
            } else {
                container.style.display = 'none';
                badge.className = 'status-badge status-online';
                badge.textContent = 'API Online';
            }
        }

        async function refreshAll() {
            try {
                showError(null);
                const data = await fetchData('/api/proxy/status');
                renderSystem(data.system || {});
                renderCPU(data.cpu || {});
                renderMemory(data.memory || {});
                renderDisk(data.disk || {});
                renderNetwork(data.network || {});
                renderProcesses(data.processes || {});
                await fetchHistoryInfo();

                document.getElementById('lastUpdate').textContent =
                    'Última actualización: ' + new Date().toLocaleTimeString();
            } catch (error) {
                showError(`Error al conectar con la API: ${error.message}`);
            }
        }

        function renderSystem(system) {
            document.getElementById('systemInfo').innerHTML = `
                <div class="metric"><span class="metric-label">Hostname:</span><span class="metric-value">${system.hostname || 'N/A'}</span></div>
                <div class="metric"><span class="metric-label">Sistema:</span><span class="metric-value">${system.platform || 'N/A'}</span></div>
                <div class="metric"><span class="metric-label">Arquitectura:</span><span class="metric-value">${system.architecture || 'N/A'}</span></div>
                <div class="metric"><span class="metric-label">Procesador:</span><span class="metric-value">${system.processor || 'N/A'}</span></div>
            `;
        }

        function renderCPU(cpu) {
            const usage = cpu.cpu_usage_percent || 0;
            document.getElementById('cpuProgress').style.width = usage + '%';
            document.getElementById('cpuProgress').textContent = usage.toFixed(1) + '%';

            document.getElementById('cpuInfo').innerHTML = `
                <div class="metric"><span class="metric-label">Núcleos Físicos:</span><span class="metric-value">${cpu.cpu_count_physical || 'N/A'}</span></div>
                <div class="metric"><span class="metric-label">Núcleos Lógicos:</span><span class="metric-value">${cpu.cpu_count_logical || 'N/A'}</span></div>
                <div class="metric"><span class="metric-label">Frecuencia:</span><span class="metric-value">${cpu.cpu_frequency_current ? cpu.cpu_frequency_current.toFixed(0) + ' MHz' : 'N/A'}</span></div>
            `;

            cpuChart.data.datasets[0].data = [usage, 100 - usage];
            cpuChart.update();
        }

        function renderMemory(memory) {
            const memoryPercent = memory.memory_percent || 0;
            document.getElementById('memoryProgress').style.width = memoryPercent + '%';
            document.getElementById('memoryProgress').textContent = memoryPercent + '%';

            document.getElementById('memoryInfo').innerHTML = `
                <div class="metric"><span class="metric-label">Total:</span><span class="metric-value">${memory.memory_total_gb || 0} GB</span></div>
                <div class="metric"><span class="metric-label">Usado:</span><span class="metric-value">${memory.memory_used_gb || 0} GB</span></div>
                <div class="metric"><span class="metric-label">Disponible:</span><span class="metric-value">${memory.memory_available_gb || 0} GB</span></div>
                <div class="metric"><span class="metric-label">Swap:</span><span class="metric-value">${memory.swap_percent || 0}%</span></div>
            `;

            memoryChart.data.datasets[0].data = [memoryPercent, 100 - memoryPercent];
            memoryChart.update();
        }

        function renderDisk(disk) {
            const partitions = disk.partitions || [];
            let html = '';
            partitions.forEach(part => {
                html += `
                    <div style="margin-bottom: 15px; padding: 10px; background: #1f2937; border: 1px solid #374151; border-radius: 5px; color: #e5e7eb;">
                        <strong>${part.mountpoint}</strong> (${part.device})
                        <div class="progress-bar" style="margin-top: 10px;">
                            <div class="progress-fill" style="width: ${part.percent}%">${part.percent}%</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; color: #d1d5db;">
                            <span>Usado: ${part.used_gb} GB</span>
                            <span>Total: ${part.total_gb} GB</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('diskInfo').innerHTML = html || 'Sin información de discos';
        }

        function renderNetwork(network) {
            document.getElementById('networkInfo').innerHTML = `
                <div class="metric"><span class="metric-label">Datos Enviados:</span><span class="metric-value">${network.bytes_sent_gb || 0} GB</span></div>
                <div class="metric"><span class="metric-label">Datos Recibidos:</span><span class="metric-value">${network.bytes_received_gb || 0} GB</span></div>
                <div class="metric"><span class="metric-label">Paquetes Enviados:</span><span class="metric-value">${network.packets_sent || 0}</span></div>
                <div class="metric"><span class="metric-label">Paquetes Recibidos:</span><span class="metric-value">${network.packets_received || 0}</span></div>
            `;
        }

        function renderProcesses(processes) {
            const items = processes.top_processes || [];
            let html = '';
            items.forEach(proc => {
                html += `
                    <div class="process-item">
                        <span>${proc.name || 'Unknown'} (PID: ${proc.pid})</span>
                        <span style="color: #60a5fa; font-weight: bold;">CPU: ${(proc.cpu_percent || 0).toFixed(1)}%</span>
                    </div>
                `;
            });
            document.getElementById('processInfo').innerHTML = html || 'Sin información de procesos';
        }

        async function fetchHistoryInfo() {
            const data = await fetchData('/api/proxy/history?limit=20');
            const items = data.items || [];
            const labels = items.map(item => new Date(item.timestamp).toLocaleTimeString());
            const cpuValues = items.map(item => item.cpu_usage_percent || 0);
            const memoryValues = items.map(item => item.memory_percent || 0);

            historyChart.data.labels = labels;
            historyChart.data.datasets[0].data = cpuValues;
            historyChart.data.datasets[1].data = memoryValues;
            historyChart.update();

            if (items.length > 0) {
                const avgCpu = cpuValues.reduce((a, b) => a + b, 0) / cpuValues.length;
                const avgMemory = memoryValues.reduce((a, b) => a + b, 0) / memoryValues.length;
                const last = items[items.length - 1];
                document.getElementById('historySummary').textContent =
                    `Registros: ${items.length} | Ultimo host: ${last.hostname || 'N/A'} | Promedio CPU: ${avgCpu.toFixed(1)}% | Promedio Memoria: ${avgMemory.toFixed(1)}%`;
            } else {
                document.getElementById('historySummary').textContent = 'Sin datos historicos disponibles.';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            refreshAll();
            setInterval(refreshAll, 30000);
        });
    </script>
</body>
</html>
